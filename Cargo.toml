[package]
name = "akio"
version = "0.0.1"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
glob = "0.3.3"
hf-hub = { version = "0.5.0", features = ["tokio"] }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["blocking"] }
rmcp = { version = "1.5.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full", "rt-multi-thread", "macros"] }

[build-dependencies]
cmake   = "0.1"
bindgen = "0.72.1"

[[bin]]
name = "akio"
path = "src/main.rs"
