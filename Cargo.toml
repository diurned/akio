[package]
name = "akio"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
bindgen = "0.73.2"
cc = "1.4.7"
cmake = "0.1.58"
