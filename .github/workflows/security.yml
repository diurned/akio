name: Security

on:
  release:
    types: [published]
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose
        continue-on-error: true
  osv:
    name: OSV Scanner
    runs-on: ubuntu-latest
    needs: gitleaks
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV Scanner
        run: |
          curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
      - name: Run OSV Scanner
        run: |
          ./osv-scanner scan source \
            --recursive \
            --no-ignore \
            --include-git-root \
            --verbosity info \
            --call-analysis "all" \
            --all-packages \
            --all-vulns \
            .
        continue-on-error: true
